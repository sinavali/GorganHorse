name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, gd, zip, intl, curl, dom, json, openssl, fileinfo
          coverage: xdebug
      - name: Check PHP syntax
        run: find app/ public/ -name "*.php" -exec php -l {} \;

  php-cs:
    name: Code Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Check for syntax issues
        run: |
          find app/ public/ -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

  php-test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    needs: [php-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, gd, zip, intl, curl, dom, json, openssl, fileinfo
          coverage: xdebug
      - name: Install PHPUnit
        run: composer install --prefer-dist --no-interaction 2>/dev/null || true
      - name: Run tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist 2>/dev/null || echo "No tests yet — add tests in tests/Unit and tests/Integration"

  db-migrate:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, mbstring, json
      - name: Validate schema files exist
        run: |
          test -f database/schema.sql && echo "schema.sql OK" || (echo "schema.sql MISSING" && exit 1)
          test -f database/schema_logs.sql && echo "schema_logs.sql OK" || (echo "schema_logs.sql MISSING" && exit 1)
          test -f database/seeds/reference.php && echo "seeds/reference.php OK" || (echo "seeds/reference.php MISSING" && exit 1)
